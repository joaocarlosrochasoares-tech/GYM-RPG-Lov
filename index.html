<script>
const $=s=>document.querySelector(s),KEY='gymrpg_midina_v1';
const L={sup:'Supino',agach:'Agachamento',dead:'Deadlift',hip:'Elev. Pélvica'},IC=['🛡️','🦵','⚓','🔥'];

const PL={
 'Dia1':['AGACHAMENTO','LEG PRESS','AFUNDOS','CADEIRA EXTENSORA','PANTURRILHA'],
 'Dia2':['PULLDOWN','REMADA BAIXA','REMADA UNILAT.','ROSCA BICEP','ROSCA MARTELO'],
 'Dia3':['DESENVOLVIMENTO','ELEVAÇÃO LATERAL','SUPINO','TRICEP','FLEXÃO'],
 'Dia4':['DEADLIFT','SUPINO INCLINADO','CRUNCH ABDOMINAL','HIPEREXTENSÃO LOMBAR','CARDIO (20/30MIN)'],
 'Dia5':['ELEVAÇÃO PÉLVICA','AGACHAMENTO SUMO','BÚLGAROS','CADEIRA ABDUTORA abrir','EXTENSÃO DE GLÚTEO'],
 'Corrida Fim de Semana':['CORRIDA']
};
/* Ranks / fases do avatar para a Midina: [nível mínimo, nome] */
const RK2=[
 [1,'Iniciante Determinada'],
 [11,'Amazonas de Ferro'],
 [21,'Atleta em Ascensão'],
 [31,'Guerreira Esculpida'],
 [41,'Valquíria Robusta'],
 [51,'Deusa do Foco'],
 [61,'Titã de Elite'],
 [71,'Imperatriz do Aço'],
 [81,'Deusa da Força'],
 [91,'Colosso Lendária']
];
const stg=lv=>RK2.filter(x=>x[0]<=lv).pop(),rank=lv=>stg(lv)[1],fase=lv=>RK2.indexOf(stg(lv))+1;
const EMB='embutido';
const avatarVideos = {
  1:  'media/f1_video.mp4',
  11: 'media/f2_video.mp4',
  21: 'media/f3_video.mp4',
  31: null,
  41: null,
  51: null,
  61: null,
  71: null,
  81: null,
  91: null
};let IM={};try{IM=JSON.parse(localStorage.getItem('gymrpg-midina-img')||'{}')}catch(e){}
let D={p:{},ss:[],cx:{},u:{}};
try{D=Object.assign(D,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
D.ss.forEach(s=>{if(LG[s.day])s.day=LG[s.day]});if(!D.p||!D.p.kg)D.p={kg:60,cm:165,age:28};
const save=()=>{try{const h=dh();if(CL){if(CL.h==='')CL.h=h;else if(h!==CL.h){D.ts=Date.now();CL.h=h}}}catch(e){}saveLocal();cloudPush()};
let V='h',day='Dia1',face='video',pe=0,rng=0,draft={},dv='',rs=0,ch=null,pm0=1,CK=1;
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const nz=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
const mk=n=>{n=nz(n);return/^supino( reto)?$/.test(n)?'sup':/^agachamento( livre)?$/.test(n)?'agach':/^(deadlift|peso morto|levantamento terra)$/.test(n)?'dead':/(elevacao pelvica|hip ?(thrust|trust))/.test(n)?'hip':''};
const pn=s=>{const x=parseFloat(String(s).replace(',','.'));return isFinite(x)?x:0};
const fm=x=>String(Math.round(x*10)/10).replace('.',',');
const rm=(w,r)=>r<1?0:w/(1.0278-.0278*Math.min(r,30));
const BW=['lastro kg (opcional)','reps',(w,r)=>`${r} reps${w?` +${fm(w)} kg`:''}`];
const CD={
 'corrida':['km','minutos',(w,r)=>`${fm(w)} km em ${r} min`],
 'corrida continua':['km','minutos',(w,r)=>`${fm(w)} km em ${r} min`],
 'cardio (20/30min)':['km (ou nível)','minutos',(w,r)=>`${r} min${w?` · ${fm(w)} km`:''}`],
 'flexao':BW,
 'crunch abdominal':BW,
 'hiperextensao lombar':BW,
 'prancha':['—','segundos',(w,r)=>`${r} s`]
};
const cd=n=>CD[nz(n)],car=n=>{const c=cd(n);return!!c&&c!==BW};
const td=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const fd=d=>d.slice(8)+'/'+d.slice(5,7)+'/'+d.slice(2,4);
const EX=d=>(PL[d]||[]).concat((D.cx&&D.cx[d])||[]);

function srt(){D.ss.sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);const z=new Set;D.ss=D.ss.filter(s=>{const k=JSON.stringify(s);return z.has(k)?0:z.add(k)})}

/* ================= XP por volume, atrofia e streak ================= */
const XP_DIV=10;
const ATR_DIAS=7,ATR_XP=0;
const STK_META=4,STK_GAP=3,STK_MULT=1.05;
const DAY=864e5,dnum=d=>Math.round(Date.parse(d)/DAY),wkn=n=>Math.floor((n+3)/7),dstr=n=>new Date(n*DAY).toISOString().slice(0,10);
function volE(e,kg){const c=cd(e.n);if(c&&c!==BW)return 0;const bw=c===BW?(+kg||+D.p.kg||0):0;return e.s.reduce((a,[w,r])=>a+(bw+(+w||0))*(+r||0),0)}

const XA=30,XP2=2.8,XM=100,fx=n=>Math.round(n).toLocaleString('pt-PT'),CXP=L=>XA*(L-1)**XP2,LV=x=>Math.min(XM,Math.floor((x/XA)**(1/XP2)+1e-9)+1);
const LT={sup:1.2,agach:2.0,dead:2.25,hip:2.5};
const MET={'corrida':[11,(w,r)=>r],'corrida continua':[11,(w,r)=>r],'cardio (20/30min)':[8,(w,r)=>r],'prancha':[4,(w,r)=>r/60]};
const MUL=n=>{n=nz(n);return/panturrilha|trapezio/.test(n)?.5:/extensora|abdutora|gluteo|pulldown|remada/.test(n)?.75:/lateral|rosca|tricep|bicep/.test(n)?.8:1};
function xpE(e,kg){const c=cd(e.n);kg=+kg||+D.p.kg||0;if(c&&c!==BW){const m=MET[nz(e.n)];return m?e.s.reduce((a,[w,r])=>a+m[0]*kg*Math.max(0,m[1](+w||0,+r||0))/60/2,0):0}return volE(e,kg)/XP_DIV*MUL(e.n)}

function S(){
 const b={sup:0,agach:0,dead:0,hip:0},h={sup:{},agach:{},dead:{},hip:{}},W={},M={},Y={},pb={};let vol=0,mv=0,ms=0;const Z={sup:{},agach:{},dead:{},hip:{}},QW={},rc={};
 D.ss.forEach(s=>{let v=0,n=0;
  s.ex.forEach(e=>{const k=mk(e.n),c=cd(e.n);e.s.forEach(([w,r])=>{n++;if(c)return;v+=w*r;if(k){const o=rm(w,r);b[k]=Math.max(b[k],o);h[k][s.d]=Math.max(h[k][s.d]||0,o)}if(k&&r<=12){const kg=swt(s)||60,o2=rm(w,r);if(o2<=6*kg)Z[k][s.d]=Math.max(Z[k][s.d]||0,o2/kg)}})});
  vol+=v;mv=Math.max(mv,v);ms=Math.max(ms,n);
  const wk=wkn(dnum(s.d)),mo=+s.d.slice(0,4)*12+ +s.d.slice(5,7);
  W[wk]=(W[wk]||0)+1;M[mo]=(M[mo]||0)+1;(Y[wk]=Y[wk]||new Set).add(s.day)});
 const byD={};D.ss.forEach(s=>(byD[s.d]=byD[s.d]||[]).push(s));
 const sx=new Map,LOG=[];let xp=+D.px||0,rec=0,last=null,cn=0;
 const atrof=g=>{if(!(g>ATR_DIAS))return null;const p=xp*Math.min(.25,(g-ATR_DIAS)*.005);xp-=p;rec+=p;return{dias:g,xp:p}};
 Object.keys(byD).sort().forEach(d=>{const n=dnum(d),ok=isFinite(n);let st=0;
  if(ok){if(last!=null){const g0=eg(last,n),a=atrof(g0);if(a)LOG.push({...a,d});cn=g0>STK_GAP?1:cn+1}else cn=1;st=cn>=STK_META?cn:0}
  const m=st>=1?STK_MULT:1;
  byD[d].forEach(s=>{const v=s.ex.reduce((a,e)=>a+volE(e,swt(s)),0);let pr=0;s.ex.forEach(e=>{const k=mk(e.n);if(!k)return;const o=Math.max(...e.s.map(([w,r])=>r<=12?rm(w,r):0));if(rc[k]&&o>rc[k]*1.0001)pr=1;rc[k]=Math.max(rc[k]||0,o)});const g=Math.round(s.ex.reduce((a,e)=>a+xpE(e,swt(s)),0)*(pr?1.05:1)*m);xp+=g;if(rec>0){const q=Math.min(rec,g*.5);xp+=q;rec-=q}const qk=wkn(n),Q=QW[qk]=QW[qk]||{f:new Set,p:0,d:0};if(DN.includes(s.day))Q.f.add(s.day);if(pr)Q.p=1;if(s.day=='Dia5')Q.d=1;sx.set(s,{v,b:v/XP_DIV,m,x:g,st,pr})});
  if(ok)last=n});
 let qx=0;Object.values(QW).forEach(q=>{qx+=(q.f.size>=3?150:0)+(q.p?150:0)+(q.d?100:0)});xp+=qx;const T=dnum(td()),gl=last==null?null:eg(last,T),atr=last==null?null:atrof(gl);
 const alive=last!=null&&gl<=STK_GAP,stk=alive&&cn>=STK_META?cn:0,wkc=alive?cn:0;
 const xpd=Math.max(0,Math.round(xp)),fi=[];for(const k in Z){const a=Object.entries(Z[k]).map(([d,v])=>[T-dnum(d),v]).filter(x=>isFinite(x[0])).sort((p,q)=>p[0]-q[0]);if(!a.length)continue;const wn=a.filter(x=>x[0]<=90),sr=wn.length?wn:a,tp=sr.map(x=>x[1]).sort((p,q)=>q-p).slice(0,2),vv=tp.reduce((p,q)=>p+q,0)/tp.length;fi.push(Math.min(1,vv/LT[k])*(wn.length?1:Math.max(0,1-(a[0][0]-90)/90)))}
 const fs=fi.length?fi.reduce((p,q)=>p+q,0)/fi.length:0,Ld=Math.min(100,(xpd/XA)**(1/XP2)+1),Lc=Math.min(XM,Math.max(1,85*fs**2.6+.15*Ld));xp=CXP(Lc);if(atr){const pc=Math.min(.25,(gl-ATR_DIAS)*.005),x0=xp;xp=x0*(1-pc);atr.xp=x0-xp}const lv=LV(xp),ds=D.ss.map(s=>Date.parse(s.d)).filter(isFinite);
 const f=(o,n)=>Object.keys(o).filter(k=>o[k]>=n).map(Number).sort((x,y)=>x-y);
 const run=a=>{let t=0,c=0;a.forEach((k,i)=>{c=i&&k==a[i-1]+1?c+1:1;t=Math.max(t,c)});return t};
 return{b,h,pb,xpd,fs,qw:QW[wkn(T)],vol,mv,ms,xp,lv,sx,LOG,atr,gl,last,lastD:last==null?null:dstr(last),stk,wkc,mult:stk>=1,n:D.ss.length,wk:run(f(W,3)),mo:run(f(M,4)),yr:ds.length?Math.floor((Math.max(...ds)-Math.min(...ds))/315576e5):0,full:Object.values(Y).some(x=>x.size>=5),t:rank(lv)}}

/* Conquistas */
const B=[],TH=[20,35,50,65,85,110,140],RK=['Iniciada','Aprendiz','Guerreira','Valquíria','Titã','Imperatriz','Deusa do Ferro'];
Object.keys(L).forEach((k,ki)=>TH.forEach((t,i)=>B.push({id:k+t,c:'Força Bruta',i:IC[ki],n:RK[i]+' · '+L[k],d:`1RM de ${t} kg em ${L[k]}`,f:s=>s.b[k]>=t})));
[[5,'5 Toneladas'],[25,'25 Toneladas'],[50,'50 Toneladas'],[100,'Centena de Ferro'],[250,'250 Toneladas'],[500,'Liga de Ferro'],[1e3,'Mil Toneladas']].forEach(([t,n])=>B.push({id:'v'+t,c:'Volume e Dedicação',i:'🏋️',n,d:`${t.toLocaleString('pt-PT')} t levantadas no total`,f:s=>s.vol/1e3>=t}));
[1,10,50,100,250,500,1000].forEach(t=>B.push({id:'s'+t,c:'Volume e Dedicação',i:'🎖️',n:t+(t>1?' Treinos':' Treino'),d:t+' treinos registados',f:s=>s.n>=t}));
[2,4,8,12,26,52].forEach(t=>B.push({id:'w'+t,c:'Consistência Temporal',i:'🔥',n:t+' Semanas de Fogo',d:t+' semanas seguidas com 3+ treinos',f:s=>s.wk>=t}));
[1,3,6,12,24].forEach(t=>B.push({id:'m'+t,c:'Consistência Temporal',i:'📅',n:t+(t>1?' Meses':' Mês')+' Imparável',d:t+' meses seguidos com 4+ treinos',f:s=>s.mo>=t}));
[1,2,3,5].forEach(t=>B.push({id:'y'+t,c:'Consistência Temporal',i:'⏳',n:t+(t>1?' Anos':' Ano')+' de Lenda',d:t+(t>1?' anos':' ano')+' de treino ativo',f:s=>s.yr>=t}));
[['Trio de Aço','Supino + Agachamento + Deadlift somam 200 kg de 1RM',s=>s.b.sup+s.b.agach+s.b.dead>=200],
['Totalista de Elite','Os 3 grandes somam 300 kg de 1RM',s=>s.b.sup+s.b.agach+s.b.dead>=300],
['Rainha do Glúteo','Elevação Pélvica de 1,5× o peso corporal',s=>D.p.kg&&s.b.hip>=1.5*D.p.kg],
['Agachamento 1,5×','Agachamento de 1,5× o peso corporal',s=>D.p.kg&&s.b.agach>=1.5*D.p.kg],
['Deadlift 1,8×','Deadlift de 1,8× o peso corporal',s=>D.p.kg&&s.b.dead>=1.8*D.p.kg],
['Sessão Titânica','5 toneladas numa só sessão',s=>s.mv>=5e3],
['Semana Completa','Os 5 dias de treino feitos na mesma semana',s=>s.full],
['Maratona de Ferro','25 séries numa só sessão',s=>s.ms>=25]].forEach(([n,d,f],i)=>B.push({id:'x'+i,c:'Segredos',i:'🗝️',n,d,f,x:1}));
function chk(){const s=S(),nw=[];B.forEach(b=>{if(!D.u[b.id]&&b.f(s)){D.u[b.id]=td();nw.push(b)}});return nw}
const nb=nw=>nw.length>3?toast('🏆 '+nw.length+' novas conquistas!'):nw.forEach(b=>toast('🏆 '+b.n));

/* Avatar provisório caso falte imagem */
const bf=()=>{const{kg,cm}=D.p;if(!kg||!cm)return .4;return Math.min(1,Math.max(0,(kg/((cm/100)**2)-19)/16))};
const mf=s=>Math.min(1,.8*Math.min(1,(s.b.sup+s.b.agach+s.b.dead+s.b.hip)/((D.p.kg||60)*6.5))+.2*Math.min(1,(s.lv-1)/40));
function av(v,b,m){
 const F=v=='f',d=m*(1-.45*b),sw=28+6*b+9*m,w=17+9*b+3*m,hp=22+6*b+2*m,ua=6.5+2*b+3.5*m,fa=4.8+1.5*b+1.8*m,th=12.5+4*b+3.5*m,e1=hp*.55+th*.85+1.5,K='url(#sk)',H='#ffe8cc';
 const X=a=>Math.round((100+a)*10)/10,N=n=>Math.round(n*10)/10;
 const lb=(x1,y1,w1,x2,y2,w2,g)=>{const c=(w1+w2)/2+2*g,xm=(x1+x2)/2,ym=(y1+y2)/2;return`M${N(x1-w1)} ${y1}Q${N(xm-c)} ${ym} ${N(x2-w2)} ${y2}L${N(x2+w2)} ${y2}Q${N(xm+c)} ${ym} ${N(x1+w1)} ${y1}Z`};
 const P=(p,f,o=1)=>`<path d="${p}" fill="${f}" fill-opacity="${o}"/>`,Ls=(p,o,k=1.2)=>`<path d="${p}" fill="none" stroke="#2a1208" stroke-opacity="${o}" stroke-width="${k}" stroke-linecap="round"/>`;
 let r=P(lb(X(hp*.55),190,th*.85,X(hp*.5+2),262,th*.5,2+3*m),K)+P(lb(X(hp*.5+2),262,th*.5,X(hp*.42+3),316,4.2,F?1.5+2*m:2+5.5*m),K)+`<ellipse cx="${X(hp*.42+4)}" cy="322" rx="7" ry="4" fill="#27272a" stroke="#38bdf8" stroke-opacity=".5"/>`;
 r+=P(`M100 60Q${X(sw*.5)} 60 ${X(sw)} 72L${X(sw-1)} 100Q${X(w+3)} 130 ${X(w)} 168Q${X(hp)} 176 ${X(hp)} 200L100 204Z`,K);
 r+=P(`M100 168L${X(w+1)} 168Q${X(hp+2)} 176 ${X(hp+2)} 200L${X(e1)} 232L100 232Z`,'#1c1c20')+`<path d="M100 170H${X(w+1)}M${X(hp+1)} 182L${X(e1-1)} 230" fill="none" stroke="#38bdf8" stroke-opacity=".8" stroke-width="1.4"/>`;
 r+=P(lb(X(sw+4),78,ua+2,X(sw+9),128,ua*.78,1.5+3.5*m),K)+P(lb(X(sw+9),128,ua*.78,X(sw+8),176,fa*.62,1+2*m),K)+`<ellipse cx="${X(sw+8)}" cy="186" rx="${N(fa*.7)}" ry="10" fill="${K}"/><ellipse cx="${X(sw+4)}" cy="78" rx="${N(ua+3)}" ry="15" fill="${K}"/>`;

/* ===== 1. Motor de Fundo da Aplicação (Constelação Cyber Azul) ===== */
const BG={cv:null,ctx:null,w:0,h:0,pts:[],pulses:[],ptr:{x:-999,y:-999},gridY:0,mode:'normal'};
function initAppBg(){
 BG.cv=$('#appBg');if(!BG.cv)return;
 BG.ctx=BG.cv.getContext('2d');
 const resize=()=>{BG.w=BG.cv.width=window.innerWidth;BG.h=BG.cv.height=window.innerHeight};
 resize();addEventListener('resize',resize);
 addEventListener('pointermove',e=>{BG.ptr.x=e.clientX;BG.ptr.y=e.clientY});
 addEventListener('pointerdown',e=>{
  BG.ptr.x=e.clientX;BG.ptr.y=e.clientY;
  bgPulse(e.clientX,e.clientY);
  for(let i=0;i<6;i++)BG.pts.push({x:e.clientX,y:e.clientY,vx:(Math.random()-.5)*3.5,vy:(Math.random()-.5)*3.5,r:Math.random()*2+1,life:35});
 });
 addEventListener('pointerleave',()=>{BG.ptr.x=-999;BG.ptr.y=-999});
 const count=Math.min(55,Math.floor((window.innerWidth*window.innerHeight)/18000));
 for(let i=0;i<count;i++)BG.pts.push({x:Math.random()*BG.w,y:Math.random()*BG.h,vx:(Math.random()-.5)*.45,vy:-(Math.random()*.55+.2),r:Math.random()*2.2+.9});
 requestAnimationFrame(renderAppBg);
}
function bgPulse(x,y){BG.pulses.push({x:x??BG.w/2,y:y??BG.h/2,r:6,a:.55})}
function syncBgMode(){
 try{const s=S();BG.mode=s.gl>ATR_DIAS?'atrophy':dlAct()?'deload':s.mult?'streak':'normal'}catch(e){}
 if(typeof syncHeroMode==='function')syncHeroMode();
}
function renderAppBg(){
 const{ctx,w,h,pts,pulses,ptr,mode}=BG;if(!ctx)return;
 const pal=mode==='atrophy'?{main:'#ff4d6d',sec:'255,77,109',bg1:'#1f070c',bg2:'#080204'}
          :mode==='deload' ?{main:'#ffd166',sec:'255,209,102',bg1:'#1c1808',bg2:'#080703'}
          :mode==='streak' ?{main:'#38bdf8',sec:'56,189,248',spark:'#ffcc33',bg1:'#0b1e36',bg2:'#030914'}
          :                 {main:'#38bdf8',sec:'56,189,248',bg1:'#08182b',bg2:'#030812'};
 const grad=ctx.createRadialGradient(w*.5,0,10,w*.5,h*.5,Math.max(w,h));
 grad.addColorStop(0,pal.bg1);grad.addColorStop(1,pal.bg2);
 ctx.fillStyle=grad;ctx.fillRect(0,0,w,h);

 BG.gridY=(BG.gridY+(mode==='streak'?.45:.22))%44;
 ctx.strokeStyle=`rgba(${pal.sec},0.04)`;ctx.lineWidth=1;ctx.beginPath();
 for(let x=0;x<w;x+=44){ctx.moveTo(x,0);ctx.lineTo(x,h)}
 for(let y=BG.gridY;y<h;y+=44){ctx.moveTo(0,y);ctx.lineTo(w,y)}
 ctx.stroke();

 if(ptr.x>0){
  const spot=ctx.createRadialGradient(ptr.x,ptr.y,4,ptr.x,ptr.y,210);
  spot.addColorStop(0,`rgba(${pal.sec},0.13)`);spot.addColorStop(1,'transparent');
  ctx.fillStyle=spot;ctx.fillRect(0,0,w,h);
 }
 for(let i=pulses.length-1;i>=0;i--){
  const p=pulses[i];p.r+=4.5;p.a*=.93;
  if(p.a<.02){pulses.splice(i,1);continue}
  ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
  ctx.strokeStyle=`rgba(${pal.sec},${p.a})`;ctx.lineWidth=2;ctx.stroke();
 }
 for(let i=pts.length-1;i>=0;i--){
  const p=pts[i];
  p.x+=p.vx;
  p.y+=p.life?p.vy:(mode==='atrophy'?Math.abs(p.vy)*.8:p.vy*(mode==='streak'?1.65:mode==='deload'?.55:1));
  const dx=p.x-ptr.x,dy=p.y-ptr.y,d=Math.hypot(dx,dy);
  if(d<105&&d>0){p.x+=(dx/d)*1.6;p.y+=(dy/d)*1.6}
  if(p.life!=null){p.life--;if(p.life<=0){pts.splice(i,1);continue}}
  else{
   if(p.y<-10){p.y=h+10;p.x=Math.random()*w}
   if(p.y>h+10){p.y=-10;p.x=Math.random()*w}
   if(p.x<-10)p.x=w+10;if(p.x>w+10)p.x=-10;
  }
  for(let j=i-1;j>=0;j--){
   const p2=pts[j],dist=Math.hypot(p.x-p2.x,p.y-p2.y);
   if(dist<95){
    ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p2.x,p2.y);
    ctx.strokeStyle=`rgba(${pal.sec},${(1-dist/95)*.16})`;ctx.stroke();
   }
  }
  ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
  ctx.fillStyle=(mode==='streak'&&i%3===0)?pal.spark:pal.main;
  ctx.fill();
 }
 requestAnimationFrame(renderAppBg);
}

/* ===== 2. Motor de Aura Interativa Exclusivo do Quadrado do Herói ===== */
const HA={cv:null,ctx:null,w:360,h:540,pts:[],pulses:[],ptr:{x:-999,y:-999,down:false},gridOff:0,mode:'normal',tick:0,running:false};
function mkHeroPt(w,h,mode,x,y,burst){
 const isStr=mode==='streak',isAtr=mode==='atrophy',isDl=mode==='deload';
 const cols=isAtr?['#ff4d6d','#ff8fa3','#c9184a']:isDl?['#ffd166','#ffb703','#38bdf8']:isStr?['#38bdf8','#ffcc33','#ff9a3c','#7dd3fc']:['#38bdf8','#0284c7','#7dd3fc'];
 const isEdge=!burst&&Math.random()<.72;
 const px=x??(isEdge?(Math.random()<.5?Math.random()*75:w-Math.random()*75):Math.random()*w);
 return{x:px,y:y??Math.random()*h,r:burst?(Math.random()*2.6+1):(Math.random()*(isStr?3.1:2.3)+1),vx:burst?(Math.random()-.5)*4.5:(Math.random()-.5)*(isAtr?1.2:.4),vy:burst?(Math.random()-.5)*4.5:isAtr?(Math.random()*1.4+.45):-(Math.random()*(isStr?2.3:isDl?.38:.9)+.3),a:Math.random()*.7+.2,c:cols[Math.floor(Math.random()*cols.length)],phase:Math.random()*Math.PI*2,life:burst?36:null};
}
function syncHeroMode(){try{const s=S();const next=s.gl>ATR_DIAS?'atrophy':dlAct()?'deload':s.mult?'streak':'normal';if(HA.mode!==next){HA.mode=next;HA.pts=[]}}catch(e){}}
function heroPulse(x,y){HA.pulses.push({x:x??HA.w/2,y:y??HA.h/2,r:6,a:.75})}
function bindHeroCanvas(){
 const cv=$('#heroAuraCv');if(!cv||HA.cv===cv)return;
 HA.cv=cv;HA.ctx=cv.getContext('2d');
 cv.width=HA.w;cv.height=HA.h;HA.pts=[];
 const getPos=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*HA.w,y:(e.clientY-r.top)/r.height*HA.h}};
 cv.addEventListener('pointermove',e=>{const p=getPos(e);HA.ptr.x=p.x;HA.ptr.y=p.y});
 cv.addEventListener('pointerdown',e=>{const p=getPos(e);HA.ptr.x=p.x;HA.ptr.y=p.y;HA.ptr.down=true;heroPulse(p.x,p.y);for(let i=0;i<10;i++)HA.pts.push(mkHeroPt(HA.w,HA.h,HA.mode,p.x,p.y,true))});
 cv.addEventListener('pointerup',()=>{HA.ptr.down=false});
 cv.addEventListener('pointerleave',()=>{HA.ptr.x=-999;HA.ptr.y=-999;HA.ptr.down=false});
}
function initHeroAura(){if(HA.running)return;HA.running=true;requestAnimationFrame(renderHeroAura)}
function renderHeroAura(){
 HA.tick++;
 if(V==='h'){
  bindHeroCanvas();
  const{ctx,w,h,pts,pulses,ptr,mode}=HA;
  if(ctx){
   ctx.clearRect(0,0,w,h);
   const pal=mode==='atrophy'?{main:'#ff4d6d',sec:'255,77,109'}:mode==='deload'?{main:'#ffd166',sec:'255,209,102'}:mode==='streak'?{main:'#38bdf8',sec:'56,189,248',spark:'#ffcc33'}:{main:'#38bdf8',sec:'56,189,248'};
   const target=mode==='streak'?52:mode==='deload'?20:mode==='atrophy'?38:32;
   while(pts.length<target)pts.push(mkHeroPt(w,h,mode));

   const spd=mode==='streak'?.75:mode==='deload'?.15:mode==='atrophy'?.3:.35;
   HA.gridOff=(HA.gridOff+spd)%36;
   const hz=h*0.68;
   ctx.strokeStyle=`rgba(${pal.sec},${mode==='streak'?0.18:0.12})`;ctx.lineWidth=1;ctx.beginPath();
   for(let i=-6;i<=6;i++){ctx.moveTo(w/2+i*18,hz);ctx.lineTo(w/2+i*85,h)}
   for(let j=0;j<7;j++){const t=((j*36+HA.gridOff)/252)**1.6,y=hz+t*(h-hz);if(y<=h){ctx.moveTo(0,y);ctx.lineTo(w,y)}}
   ctx.stroke();

   const baseG=ctx.createRadialGradient(w/2,h*.92,6,w/2,h*.9,w*.55);
   baseG.addColorStop(0,`rgba(${pal.sec},0.5)`);if(mode==='streak')baseG.addColorStop(0.45,'rgba(255,204,51,0.25)');baseG.addColorStop(1,'transparent');
   ctx.fillStyle=baseG;ctx.fillRect(0,0,w,h);

   ctx.save();ctx.translate(w/2,h*.9);ctx.scale(1,0.25);
   for(let r=0;r<2;r++){ctx.beginPath();ctx.arc(0,0,70+r*36+Math.sin(HA.tick*.05+r)*5,0,Math.PI*2);ctx.strokeStyle=r===1&&mode==='streak'?'rgba(255,204,51,0.5)':`rgba(${pal.sec},0.42)`;ctx.lineWidth=2.2;ctx.stroke()}
   ctx.restore();

   if(ptr.x>0){
    const spot=ctx.createRadialGradient(ptr.x,ptr.y,2,ptr.x,ptr.y,110);
    spot.addColorStop(0,`rgba(${pal.sec},0.28)`);spot.addColorStop(1,'transparent');
    ctx.fillStyle=spot;ctx.fillRect(0,0,w,h);
   }
   for(let i=pulses.length-1;i>=0;i--){
    const p=pulses[i];p.r+=3.8;p.a*=.92;
    if(p.a<.02){pulses.splice(i,1);continue}
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.strokeStyle=mode==='streak'&&i%2===0?`rgba(255,204,51,${p.a})`:`rgba(${pal.sec},${p.a})`;
    ctx.lineWidth=2;ctx.stroke();
   }
   for(let i=pts.length-1;i>=0;i--){
    const p=pts[i],glitch=mode==='atrophy'?(Math.random()-.5)*2.4:Math.sin(HA.tick*.04+p.phase)*.35;
    p.x+=p.vx+glitch;p.y+=p.vy;
    const dx=p.x-ptr.x,dy=p.y-ptr.y,d=Math.hypot(dx,dy);
    if(d<85&&d>1){const dir=ptr.down?-1.3:1.9;p.x+=(dx/d)*dir;p.y+=(dy/d)*dir}
    if(p.life!=null){p.life--;p.a*=.93;if(p.life<=0){pts.splice(i,1);continue}}
    else{if(p.y<-15){p.y=h+10;p.x=Math.random()*w}if(p.y>h+15){p.y=-10;p.x=Math.random()*w}if(p.x<-10)p.x=w+10;if(p.x>w+10)p.x=-10}
    ctx.beginPath();
    if(mode==='streak'&&!p.life)ctx.ellipse(p.x,p.y,p.r*.85,p.r*2.2,0,0,Math.PI*2);else ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle=p.c;ctx.globalAlpha=p.a;ctx.shadowBlur=10;ctx.shadowColor=p.c;ctx.fill();
   }
   ctx.globalAlpha=1;ctx.shadowBlur=0;
  }
 }
 requestAnimationFrame(renderHeroAura);
}

function getMyWeekStats(s) {
  const T = dnum(td()), wk = wkn(T), w0 = wk * 7 - 3;
  const wkSS = D.ss.filter(x => { const n = dnum(x.d); return n >= w0 && n <= w0 + 6; });
  const wkVol = Math.round(wkSS.reduce((a, x) => a + x.ex.reduce((b, e) => b + volE(e, swt(x)), 0), 0));
  const wkXP = Math.round(wkSS.reduce((a, x) => a + ((s.sx.get(x) || {}).x || 0), 0));
  let wkKm = 0;
  wkSS.forEach(x => (x.ex || []).forEach(e => {
    const n = nz(e.n);
    if (n === 'corrida' || n === 'corrida continua' || n === 'cooper') {
      (e.s || []).forEach(([w]) => { wkKm += (n === 'cooper' ? (+w || 0) / 1000 : (+w || 0)); });
    }
  }));
  wkKm = Math.round(wkKm * 10) / 10;
  const kg = +D.p.kg || 60;
  const rel = Math.round(((wkVol + wkKm * 150) / kg) * 10) / 10;
  return { wk, wkTrades: wkSS.length, wkVol, wkXP, wkKm, kg, rel };
}

async function duoPushWorkout(ns, g, s1, customEv) {
  if (!DUO.url) return;
  const st = getMyWeekStats(s1);
  const payload = {
    name: DUO.me, lv: s1.lv, rank: s1.t, xp: Math.round(s1.xp), stk: s1.stk,
    kg: st.kg, wk: st.wk, wkTrades: st.wkTrades, wkVol: st.wkVol, wkXP: st.wkXP, wkKm: st.wkKm, rel: st.rel,
    ts: Date.now()
  };

  let ev = customEv || null;
  if (!ev && ns && g) {
    let rKm = 0, rMin = 0;
    (ns.ex || []).forEach(e => {
      const n = nz(e.n);
      if (n === 'corrida' || n === 'corrida continua' || n === 'cooper') {
        (e.s || []).forEach(([w, r]) => { rKm += (n === 'cooper' ? (+w || 0) / 1000 : (+w || 0)); rMin += (+r || 0); });
      }
    });
    ev = {
      type: 'workout', who: DUO.me, day: ns.day, d: ns.d,
      vol: Math.round(g.v), xp: Math.round(g.x), km: Math.round(rKm * 10) / 10, min: Math.round(rMin),
      pr: !!g.pr, lv: s1.lv, ts: Date.now()
    };
  }

  try {
    const base = `${DUO.url}/rooms/${DUO.room}`;
    await fetch(`${base}/players/${encodeURIComponent(DUO.me)}.json`, {
      method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload)
    });
    await fetch(`${base}/history/${st.wk}/${encodeURIComponent(DUO.me)}.json`, {
      method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ rel: st.rel, xp: st.wkXP, vol: st.wkVol, km: st.wkKm })
    });
    if (ev) {
      await fetch(`${base}/events/${ev.ts}.json`, {
        method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(ev)
      });
      if (DUO.feed && DUO.feed.length >= 20) {
        DUO.feed.slice(19).forEach(old => {
          if (old && old.ts) fetch(`${base}/events/${old.ts}.json`, { method: 'DELETE' }).catch(()=>{});
        });
      }
    }
  } catch (e) {}
}

async function duoClaimBoss(wk) {

  D.px = (+D.px || 0) + 200;

    await fetch(`${base}/claims/${wk}_${encodeURIComponent(DUO.me)}.json`, {
      method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(true)
    });
    // Verifica se o escalão já subiu nesta semana; se não, fortalece o próximo Boss!

      const nextTier = (DUO.bossTier || 1) + 1;

        method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(nextTier)

        method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(wk)
      });
      DUO.bossTier = nextTier;
    }
  } catch(e) {}

  if (typeof bgPulse === 'function') bgPulse();
  if (typeof heroPulse === 'function') heroPulse();
  const s1 = S();
  await duoPushWorkout(null, null, s1, {
    type: 'boss', who: DUO.me, text: `🎁 ${DUO.me} abriu o Baú do Boss (+200 XP)! O próximo Boss subiu para Nv ${DUO.bossTier}!`, d: td(), ts: Date.now()
  });
  toast(`🎁 Baú aberto (+200 XP)! O próximo Boss será Nv ${DUO.bossTier}!`);
  R();
}

async function duoPoll(force) {
  if (!DUO.url || (document.hidden && !force)) return;
  try {
    const res = await fetch(`${DUO.url}/rooms/${DUO.room}.json`);
    if (!res.ok) return;
    const data = await res.json() || {};

    const players = data.players || {};
    const peerKey = Object.keys(players).find(k => k !== DUO.me);
    const prevPeerTs = DUO.peer ? DUO.peer.ts : 0;
    if (peerKey) DUO.peer = players[peerKey];

    DUO.stake = (data.meta && data.meta.stake) || '';
    DUO.hist = data.history || {};
    DUO.bossTier = Math.max(1, +(data.meta && data.meta.bossTier) || 1);
    const remoteClaims = data.claims || {};
    Object.keys(remoteClaims).forEach(k => { DUO.claims[k.replace('_', '|')] = true; });

    const evObj = data.events || {};
    const evList = Object.values(evObj).sort((a, b) => b.ts - a.ts).slice(0, 15);
    DUO.feed = evList;

    const latestPartnerEv = evList.find(e => e.who !== DUO.me);
    if (latestPartnerEv && latestPartnerEv.ts > (DUO.lastTs || 0)) {
      const isFirstLoad = !DUO.lastTs;
      DUO.lastTs = latestPartnerEv.ts;
      localStorage.setItem(DUO_KEY, JSON.stringify(DUO));
      if (!isFirstLoad) {
        let msg = '';
        if (latestPartnerEv.type === 'taunt' || latestPartnerEv.type === 'boss') {
          msg = latestPartnerEv.text;
          if (typeof bgPulse === 'function') bgPulse();
        } else {
          const det = latestPartnerEv.km > 0 ? `🏃 ${fm(latestPartnerEv.km)} km em ${latestPartnerEv.min} min` : `${fx(latestPartnerEv.vol)} kg`;
          msg = `⚔️ ${latestPartnerEv.who} acabou de registar ${latestPartnerEv.day} (${det} · +${fx(latestPartnerEv.xp)} XP)${latestPartnerEv.pr ? ' 🏅 RECORDE!' : ''}!`;
        }
        toast(msg);
        if ('Notification' in window && Notification.permission === 'granted') {
          new Notification('GYM RPG · Arena de Casal', { body: msg, icon: 'icon-192.png' });
        }
      }
      if (V === 'n' || V === 'h') R();
    } else if (DUO.peer && DUO.peer.ts !== prevPeerTs && V === 'n') {
      R();
    }
  } catch (e) {}
}
setInterval(() => duoPoll(false), 15000);
